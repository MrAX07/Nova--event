# Render "Blueprint": opretter både databasen og web-tjenesten (bot + kontrolpanel) automatisk.
databases:
  - name: nova-events-db
    plan: basic-256mb
    databaseName: nova_events

services:
  - type: web
    name: nova-events
    runtime: node
    plan: starter            # skal være en betalt/altid-tændt plan, ellers går botten i dvale
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nova-events-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false          # fx https://nova-events.onrender.com/auth/callback
